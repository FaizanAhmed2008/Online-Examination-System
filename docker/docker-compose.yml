# Local PostgreSQL for development only.
# Credentials match apps/api/.env -> DATABASE_URL (see ../../.env.example).
services:
  postgres:
    image: postgres:17-alpine
    container_name: oes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oes
      POSTGRES_PASSWORD: oes
      POSTGRES_DB: oes
    ports:
      - '5432:5432'
    volumes:
      - oes-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oes -d oes']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oes-postgres-data:
